<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoManCiS Dashboard</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="sidebar">
  <div class="logo">
    RoManCiS <br>
    <div class="subtitle">
      Robotik Mansatu Cirebon Smarthome
    </div>
  </div>

  <div class="menu">
    <button onclick="showPage('dashboard')">🏠 Dashboard</button>
    <button onclick="showPage('setname')">📋 SetName RFID</button>
    <button onclick="showPage('monitoring')">📡 Monitoring</button>
  </div>
</div>

<div class="content">

  <!-- DASHBOARD -->
  <div id="dashboard" class="page">
    <div class="card">
      <h1>Dashboard</h1>
    </div>
  </div>

  <!-- SETNAME -->
  <div id="setname" class="page">
    <div class="card">
      <h1>SetName RFID</h1>
    </div>
  </div>

  <!-- MONITORING -->
  <div id="monitoring" class="page">

    <div class="card">

      <h1>📡 Monitoring Realtime</h1>

      <div id="mqttStatus">🔴 Disconnected</div>

      <p>UID: <span id="uid">-</span></p>
      <p>Status: <span id="status">-</span></p>
      <p>Rain: <span id="rain">-</span></p>

      <h3>Log</h3>
      <div id="logBox"></div>

    </div>

  </div>

</div>

<!-- MQTT LIB -->
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<script type="module" src="./config.js"></script>
<script type="module" src="./ui.js"></script>
<script type="module" src="./mqtt.js"></script>
<script type="module" src="./app.js"></script>

</body>
</html>
