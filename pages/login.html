<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - RoManCiS</title>

<link rel="icon" href="../assets/logo.png">

<!-- CSS -->
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/sidebar.css">
<link rel="stylesheet" href="../css/login.css">

</head>

<body>

<!-- ========================= -->
<!-- SIDEBAR -->
<!-- ========================= -->

<aside class="sidebar">

    <div class="logo-container">

        <img
            src="../assets/logo.png"
            alt="RoManCiS Logo"
            class="logo-img">

        <h2 class="logo-text">
            RoManCiS
        </h2>

        <p class="logo-subtitle">
            Robotik MAN 1 Cirebon Smart Home
        </p>

    </div>

    <nav class="menu">

        <a href="../index.html" class="menu-link">
            🏠 Dashboard
        </a>

        <a href="./setname.html" class="menu-link">
            📋 SetName RFID
        </a>

        <a href="./monitoring.html" class="menu-link">
            📡 Monitoring
        </a>

    </nav>

</aside>

<!-- ========================= -->
<!-- CONTENT -->
<!-- ========================= -->

<main class="content">

    <div class="card login-card">

        <h1>
            🔐 Login Admin
        </h1>

        <p class="login-subtitle">
            Silakan login menggunakan akun Firebase
        </p>

        <br>

        <!-- USERNAME -->

        <input
            id="loginUsername"
            type="text"
            class="input-box"
            placeholder="Username"
            onkeydown="
            if(event.key==='Enter')
            document.getElementById('loginPassword').focus();">

        <br><br>

        <!-- PASSWORD -->

        <div class="password-box">

            <input
                id="loginPassword"
                type="password"
                class="input-box"
                placeholder="Password"
                onkeydown="
                if(event.key==='Enter')
                loginFirebase();">

            <button
                class="show-pass"
                onclick="togglePassword()">

                👁️

            </button>

        </div>

        <br><br>

        <!-- LOGIN BUTTON -->

        <button
            id="loginBtnAction"
            class="login-btn"
            onclick="loginFirebase()">

            <span id="loginText">
                Masuk
            </span>

            <span
                id="loginLoading"
                style="display:none;">

                Loading...

            </span>

        </button>

        <br><br>

        <p id="loginInfo">

            Silakan login

        </p>

    </div>

</main>

<!-- ========================= -->
<!-- FIREBASE -->
<!-- ========================= -->

<script type="module" src="../js/firebase.js"></script>
<script type="module" src="../js/auth.js"></script>

</body>
</html>
